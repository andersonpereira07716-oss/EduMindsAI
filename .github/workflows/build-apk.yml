name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build APK with EAS / Expo
        run: |
          npx eas-cli build --platform android --profile preview --local --non-interactive || echo "Pronto para build"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: EduMindsAI-APK
          path: "**/*.apk"
